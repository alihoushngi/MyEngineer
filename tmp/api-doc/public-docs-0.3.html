<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>emohandes API Docs — v1</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        body { margin: 0; background: #fafafa; }
        .topbar-note {
            background: #047857; color: #fff; font-family: sans-serif;
            padding: 8px 16px; font-size: 14px; text-align: center;
        }
    </style>
</head>
<body>
    <div class="topbar-note">
        نسخه ۰.۳ — همه‌ی ۶۹ قرارداد فرانت (F1، F2، F3) مستند شده‌اند؛ کد قرارداد در عنوان هر endpoint آمده است. راهنمای نگاشت: docs/frontend-contract-mapping.md
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                url: "https://test.kbdcland.ir/public/docs/openapi.yaml",
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis],
                layout: 'BaseLayout',
                deepLinking: true,
            });
        };
    </script>
</body>
</html>
